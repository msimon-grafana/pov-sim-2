{{- if .Values.alloy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pov-sim.componentFullname" (dict "root" . "component" "alloy") }}
  labels:
    {{- include "pov-sim.labels" . | nindent 4 }}
    {{- include "pov-sim.selectorLabels" (dict "root" . "component" "alloy") | nindent 4 }}
spec:
  replicas: {{ .Values.alloy.replicaCount }}
  selector:
    matchLabels:
      {{- include "pov-sim.selectorLabels" (dict "root" . "component" "alloy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pov-sim.selectorLabels" (dict "root" . "component" "alloy") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: alloy
          image: "{{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}"
          imagePullPolicy: {{ .Values.alloy.image.pullPolicy }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:{{ .Values.alloy.service.uiPort }}
            - --storage.path=/var/lib/alloy/data
            - --stability.level=public-preview
            - /etc/alloy/config.alloy
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.alloy.service.grpcPort }}
            - name: otlp-http
              containerPort: {{ .Values.alloy.service.httpPort }}
            - name: ui
              containerPort: {{ .Values.alloy.service.uiPort }}
            - name: metrics
              containerPort: {{ .Values.alloy.service.metricsPort }}
          env:
            - name: CLOUD_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "pov-sim.secretName" . }}
                  key: CLOUD_OTLP_ENDPOINT
            - name: CLOUD_OTLP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "pov-sim.secretName" . }}
                  key: CLOUD_OTLP_USERNAME
            - name: CLOUD_OTLP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pov-sim.secretName" . }}
                  key: CLOUD_OTLP_PASSWORD
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
            - name: alloy-data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            tcpSocket:
              port: ui
          livenessProbe:
            tcpSocket:
              port: ui
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
      volumes:
        - name: alloy-config
          configMap:
            name: {{ include "pov-sim.componentFullname" (dict "root" . "component" "alloy-config") }}
        - name: alloy-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pov-sim.componentFullname" (dict "root" . "component" "alloy") }}
  labels:
    {{- include "pov-sim.labels" . | nindent 4 }}
    {{- include "pov-sim.selectorLabels" (dict "root" . "component" "alloy") | nindent 4 }}
spec:
  type: {{ .Values.alloy.service.type }}
  selector:
    {{- include "pov-sim.selectorLabels" (dict "root" . "component" "alloy") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.alloy.service.grpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.alloy.service.httpPort }}
      targetPort: otlp-http
    - name: ui
      port: {{ .Values.alloy.service.uiPort }}
      targetPort: ui
    - name: metrics
      port: {{ .Values.alloy.service.metricsPort }}
      targetPort: metrics
{{- end }}
